name: Bug report
description: Nahlasit chybu
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Popis
      description: Co je spatne
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Kroky k reprodukci
      description: Jak chybu vyvolat
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ocekavane chovani
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Skutecne chovani
    validations:
      required: true